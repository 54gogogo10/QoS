<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>qostool QoS 测试工具</title>
<style>
  :root { --bg:#111; --panel:#1a1a1a; --border:#333; --fg:#ddd; --accent:#4a9eff; --red:#ff5555; }
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:12px 16px; }
  h1 { font-size:17px; margin:0; display:inline; }
  .header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  .badge { font-size:12px; padding:2px 10px; border-radius:10px; background:#333; }
  .badge.running { background:#1e5e1e; color:#7dff7d; }
  .badge.stopped { background:#5e1e1e; color:#ff7d7d; }
  select, input, button { font-size:13px; background:#222; color:var(--fg); border:1px solid var(--border); padding:4px 8px; border-radius:4px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); color:#fff; border:none; padding:5px 18px; font-size:14px; }
  button.stop { background:#a33; color:#fff; border:none; padding:5px 18px; font-size:14px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .panel h2 { font-size:14px; margin:0 0 8px; color:#aaa; font-weight:normal; }
  .cfg-table { width:100%; border-collapse:collapse; font-size:12px; }
  .cfg-table th, .cfg-table td { border:1px solid var(--border); padding:3px 5px; text-align:center; }
  .cfg-table th { background:#222; font-weight:normal; }
  .cfg-table input { width:100%; min-width:52px; padding:2px 4px; border:1px solid transparent; background:transparent; text-align:center; }
  .cfg-table input:focus { border-color:var(--accent); background:#1c1c1c; }
  .cfg-table td.name { width:90px; }
  .cfg-table td.ip { width:105px; }
  .cfg-table td.num { width:62px; }
  .cfg-table td.dscp { width:64px; }
  #chart { width:100%; height:300px; background:#161616; border:1px solid var(--border); border-radius:4px; }
  .legend { margin:6px 0; font-size:12px; }
  .legend span { display:inline-block; margin-right:12px; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:middle; }
  table.stats { border-collapse:collapse; width:100%; margin-top:8px; font-size:12px; }
  /* 可拖动列宽 */
  table.resizable { table-layout: fixed; }
  table.resizable th { position: relative; overflow: hidden; }
  table.resizable th .resizer {
    position: absolute; right: -3px; top: 0; width: 7px; height: 100%;
    cursor: col-resize; user-select: none; z-index: 2;
  }
  table.resizable th .resizer:hover { background: rgba(255,255,255,0.2); }
  table.resizable th .resizer.active { background: var(--accent); }
  table.resizable td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.stats th, table.stats td { border:1px solid var(--border); padding:3px 8px; text-align:right; }
  table.stats th { background:#222; }
  table.stats td:first-child, table.stats th:first-child { text-align:left; }
  tr.loss td { color:var(--red); }
  #msg { font-size:14px; min-height:20px; margin:6px 0 8px; padding:6px 10px; border-radius:4px; background:#1a1a1a; }
  #msg.err { color:var(--red); border:1px solid #5e1e1e; background:#2a1212; }
  #msg.ok { color:#7dff7d; border:1px solid #1e5e1e; background:#122a12; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hint { font-size:12px; color:#888; }
</style>
</head>
<body>

<div class="header">
  <h1>qostool QoS 测试工具</h1>
  <span class="badge stopped" id="badge">未运行</span>
  <span id="clock" class="hint"></span>
</div>
<p id="msg"></p>

<div class="panel">
  <div class="row">
    <label>角色</label>
    <select id="role" style="min-width:140px">
      <option value="bidir">双向（收发）</option>
      <option value="recv">接收端（只监听）</option>
      <option value="send">发送端（只发送）</option>
    </select>
    <label id="lblIface">监听接口</label>
    <select id="iface" style="min-width:300px"></select>
    <button id="btnRefreshIface">刷新</button>
    <label id="lblRemote">发送端地址</label>
    <input id="remoteAddr" placeholder="192.168.1.10:16666" style="width:160px">
    <button id="btnRemote">连接</button>
    <span id="remoteStatus" class="hint" style="display:none"></span>
    <button id="btnStart" class="primary">开始测试</button>
    <button id="btnStop" class="stop" disabled>停止</button>
    <span id="runHint" class="hint"></span>
  </div>
</div>

<div class="panel">
  <h2>流量配置（8 条流 · 5 元组 / DSCP / 双速率限速）</h2>
  <table class="cfg-table resizable" id="cfgTable">
    <thead>
      <tr>
        <th>流名</th><th>源 IP</th><th>源端口</th><th>目的 IP</th><th>目的端口</th>
        <th>DSCP</th><th id="thRateMbps">带宽 Mbps</th><th id="thRatePps">包速率 pps</th><th id="thIPLen">IP包长度</th>
      </tr>
    </thead>
    <tbody id="cfgBody"></tbody>
  </table>
  <div class="row" style="margin-top:8px">
    <button id="btnApply" class="primary">应用配置</button>
    <span class="hint">应用后若测试正在运行将自动重启；DSCP 可填 0-63 或名字（EF/AF41/CS7）</span>
  </div>
  <div class="row" style="margin-top:4px">
    <span class="hint">带宽与包速率自动联动换算（基于 IP 包长度）：改任一数值，另一项自动跟随</span>
  </div>
</div>

<div class="panel">
  <h2>实时速率曲线（TX 实线 / RX 虚线）</h2>
  <div class="legend" id="legend"></div>
  <canvas id="chart"></canvas>
  <div id="ifaceStat" class="hint" style="margin-top:6px; display:none"></div>
  <table class="stats resizable" id="statsTable">
    <thead><tr>
      <th>流</th><th>DSCP</th><th>5元组</th>
      <th id="thTxMbps">TX Mbps</th><th id="thTxPps">TX pps</th><th class="sc-rx">RX Mbps</th><th class="sc-rx">RX pps</th>
      <th>TX 包</th><th class="sc-rxpk">RX 包</th><th class="sc-loss">丢失</th><th class="sc-loss">丢包率</th>
    </tr></thead>
    <tbody id="statsBody"></tbody>
  </table>
</div>

<script>
const COLORS = ["#e6194B","#3cb44b","#ffe119","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6"];
const WINDOW = 300;
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let remoteControl = true;
let lastIface = localStorage.getItem('qostool.iface') || '';

const $ = id => document.getElementById(id);

// ---------- 接口 ----------

async function loadInterfaces(select) {
  try {
    const r = await fetch('/api/interfaces');
    if (!r.ok) throw new Error(await r.text());
    const devs = await r.json();
    const sel = $('iface');
    const prev = lastIface || sel.value;
    sel.innerHTML = '';
    for (const d of devs) {
      const opt = document.createElement('option');
      opt.value = d.name;
      const ips = (d.addresses || []).join(', ');
      opt.textContent = (d.description ? d.description : d.name) + (ips ? '  [' + ips + ']' : '');
      sel.appendChild(opt);
    }
    if (prev) sel.value = prev;
    if (!sel.value && devs.length) sel.value = devs[0].name;
    if (!devs.length) {
      showMsg('未发现可用接口：请确认已安装 Npcap 并以管理员身份运行', true);
    }
    if (select && sel.value) applyIface();
  } catch (e) {
    showMsg('枚举接口失败: ' + e.message + '（请确认已安装 Npcap）', true);
  }
  updateStartButton();
}

// updateStartButton 根据接口是否已选决定开始按钮可用性。
function updateStartButton() {
  const hasIface = $('iface').options.length > 0;
  $('btnStart').disabled = !hasIface || !remoteControl;
  if (!hasIface && remoteControl) {
    $('runHint').textContent = '未发现接口——请安装/启动 Npcap 后点"刷新"';
  }
}

function applyIface() {
  lastIface = $('iface').value;
  localStorage.setItem('qostool.iface', lastIface);
}

// ---------- 配置表单 ----------

function loadConfig() {
  fetch('/api/config?mode=' + currentMode).then(r => r.json()).then(cfg => {
    buildLegend(cfg.flows);
    const body = $('cfgBody');
    body.innerHTML = '';
    for (const f of cfg.flows) {
      const tr = document.createElement('tr');
      const cell = (id, val) => {
        let cls = 'num';
        if (id === 'name') cls = 'name';
        else if (id === 'src_ip' || id === 'dst_ip') cls = 'ip';
        else if (id === 'dscp') cls = 'dscp';
        else if (id === 'rate_mbps' || id === 'rate_pps' || id === 'ip_len') cls = 'rate ' + id;
        return `<td class="${cls}"><input data-id="${id}" value="${esc(f[id])}"></td>`;
      };
      tr.innerHTML =
        cell('name', f.name) + cell('src_ip', f.src_ip) + cell('src_port', f.src_port) +
        cell('dst_ip', f.dst_ip) + cell('dst_port', f.dst_port) + cell('dscp', f.dscp) +
        cell('rate_mbps', f.rate_mbps) + cell('rate_pps', f.rate_pps) + cell('ip_len', f.ip_len);
      linkRates(tr);
      body.appendChild(tr);
    }
    applyRateColumnVisibility(); // 表格填充后按角色隐藏速率列
  }).catch(e => showMsg('加载配置失败: ' + e.message, true));
}

// initTableResize 初始化可拖动列宽（colgroup 控制宽度，localStorage 记忆）。
// 返回 {cols} 供隐藏列时同步操作。
function initTableResize(tableId, storageKey, defaultWidths) {
  const table = document.getElementById(tableId);
  const headRow = table.querySelector('thead tr');
  const nCols = headRow.children.length;
  const saved = null;
  let savedArr = null;
  try { savedArr = JSON.parse(localStorage.getItem(storageKey)); } catch (e) {}
  const colgroup = document.createElement('colgroup');
  const cols = [];
  for (let i = 0; i < nCols; i++) {
    const col = document.createElement('col');
    const w = (savedArr && savedArr[i]) || defaultWidths[i] || 80;
    col.style.width = w + 'px';
    colgroup.appendChild(col);
    cols.push(col);
  }
  table.insertBefore(colgroup, table.firstChild);
  [...headRow.children].forEach((th, i) => {
    const resizer = document.createElement('div');
    resizer.className = 'resizer';
    th.appendChild(resizer);
    let startX = 0, startW = 80;
    resizer.addEventListener('mousedown', e => {
      e.preventDefault();
      startX = e.clientX;
      startW = parseInt(cols[i].style.width) || 80;
      resizer.classList.add('active');
      document.body.style.userSelect = 'none';
      const onMove = ev => {
        const w = Math.max(40, startW + ev.clientX - startX);
        cols[i].style.width = w + 'px';
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        resizer.classList.remove('active');
        document.body.style.userSelect = '';
        const arr = cols.map(c => parseInt(c.style.width) || 80);
        try { localStorage.setItem(storageKey, JSON.stringify(arr)); } catch (e) {}
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
  return { table, cols };
}

// linkRates 联动带宽与包速率：改一个自动换算另一个（基于本行 ip_len）。
// 换算公式：带宽(Mbps) = 包速率 × ip_len(字节) × 8 / 1e6
function linkRates(row) {
  const mbps = row.querySelector('input[data-id="rate_mbps"]');
  const pps = row.querySelector('input[data-id="rate_pps"]');
  const ipLen = row.querySelector('input[data-id="ip_len"]');
  let syncing = false;
  const recalc = (from) => {
    if (syncing) return;
    syncing = true;
    const len = +ipLen.value || 0;
    if (from === 'mbps') {
      const m = +mbps.value || 0;
      pps.value = (m > 0 && len > 0) ? Math.round(m * 1e6 / 8 / len) : '';
    } else {
      const p = +pps.value || 0;
      mbps.value = (p > 0 && len > 0) ? (p * len * 8 / 1e6).toFixed(2) : '';
    }
    syncing = false;
  };
  // 打开时补全显示：配置只填了一个速率时，另一个显示换算值（保持两栏一致）
  const len0 = +ipLen.value || 0;
  if (len0 > 0) {
    if (+mbps.value > 0 && +pps.value <= 0) recalc('mbps');
    else if (+pps.value > 0 && +mbps.value <= 0) recalc('pps');
  }
  mbps.addEventListener('input', () => recalc('mbps'));
  pps.addEventListener('input', () => recalc('pps'));
  // ip_len 变化：以当前有值的速率为主重新联动
  ipLen.addEventListener('input', () => {
    if (syncing) return;
    if (+mbps.value > 0) recalc('mbps');
    else if (+pps.value > 0) recalc('pps');
  });
}

const esc = v => String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function applyConfig() {
  const rows = document.querySelectorAll('#cfgBody tr');
  const isRecv = currentMode === 'recv';
  const flows = [];
  for (const tr of rows) {
    const get = id => tr.querySelector(`input[data-id="${id}"]`).value.trim();
    const flow = {
      name: get('name'), protocol: 'udp',
      src_ip: get('src_ip'), src_port: +get('src_port'),
      dst_ip: get('dst_ip'), dst_port: +get('dst_port'),
      dscp: get('dscp'),
    };
    // 接收端只监听：不提交发送参数（带宽/包速率/包长）
    if (!isRecv) {
      flow.rate_mbps = +get('rate_mbps') || 0;
      flow.rate_pps = +get('rate_pps') || 0;
      flow.ip_len = +get('ip_len') || 0;
    }
    flows.push(flow);
  }
  try {
    const r = await fetch('/api/config?mode=' + currentMode, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({flows}),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.statusText);
    showMsg(d.restarted ? '配置已应用，测试已自动重启' : '配置已应用（未运行）', false);
    buildLegend(flows); // 图例同步新流名
  } catch (e) { showMsg('应用配置失败: ' + e.message, true); }
}

// ---------- 启停 ----------

let currentMode = 'bidir';

// setRole 切换面板（三种角色独立运行、独立配置，互不干扰）。
function setRole(role) {
  currentMode = role;
  refreshRoleUI();
  loadConfig();
  loadStatus();
}

// refreshRoleUI 按角色显示/隐藏接口选择与发送端地址，并调整按钮文案。
function refreshRoleUI() {
  const isSend = currentMode === 'send';
  const isRecv = currentMode === 'recv';
  $('lblIface').style.display = isSend ? 'none' : '';
  $('iface').style.display = isSend ? 'none' : '';
  $('btnRefreshIface').style.display = isSend ? 'none' : '';
  $('lblRemote').style.display = isRecv ? '' : 'none';
  $('remoteAddr').style.display = isRecv ? '' : 'none';
  $('btnRemote').style.display = isRecv ? '' : 'none';
  $('btnStart').textContent = isSend ? '开始发送' : isRecv ? '开始监听' : '开始测试';
  // 表头：发送端角色 TX 为本端；接收端角色 TX 列显示远端发送端速率
  $('thTxMbps').textContent = isRecv ? '远端TX Mbps' : 'TX Mbps';
  $('thTxPps').textContent = isRecv ? '远端TX pps' : 'TX pps';
  applyRateColumnVisibility();
  applyStatsColumnVisibility();
  updateStartButton();
}

// applyRateColumnVisibility 接收端隐藏 带宽/包速率/IP包长度 列（只监听无需发送参数）。
// 注意：配置表格是异步填充的，填充后必须再次调用本函数。
function applyRateColumnVisibility() {
  const hideRates = currentMode === 'recv';
  $('thRateMbps').style.display = hideRates ? 'none' : '';
  $('thRatePps').style.display = hideRates ? 'none' : '';
  $('thIPLen').style.display = hideRates ? 'none' : '';
  document.querySelectorAll('#cfgBody td.rate').forEach(td => td.style.display = hideRates ? 'none' : '');
  // 同步隐藏 colgroup 对应列（避免隐藏列残留宽度）
  RATE_COL_IDX.forEach(i => {
    if (cfgResize.cols[i]) cfgResize.cols[i].style.display = hideRates ? 'none' : '';
  });
}

async function doStart() {
  const isSend = currentMode === 'send';
  const iface = $('iface').value;
  if (!isSend && !iface) { showMsg('请先选择监听接口（点"刷新"重新枚举）', true); return; }
  applyIface();
  $('btnStart').disabled = true;
  $('btnStart').textContent = isSend ? '发送中...' : '启动中...';
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 8000);
  try {
    const r = await fetch('/api/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({iface, mode: currentMode}), signal: ac.signal,
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    showMsg((isSend ? '发送' : '测试') + '已启动' + (isSend ? '' : '（接口 ' + iface + '）'), false);
  } catch (e) {
    const msg = e.name === 'AbortError'
      ? '启动超时：接口无响应，请换一个接口（推荐 NPF_Loopback 或真实网卡）重试'
      : ('启动失败: ' + e.message);
    showMsg(msg, true);
    alert(msg);
  } finally {
    clearTimeout(timer);
    $('btnStart').textContent = isSend ? '开始发送' : '开始测试';
    loadStatus(); // 立即刷新状态（若已运行则按钮由 loadStatus 保持禁用）
  }
}

// setRemote 设置发送端地址（接收端拉取其 TX 统计）。
async function setRemote() {
  const addr = $('remoteAddr').value.trim();
  if (!addr) { showMsg('请输入发送端地址，如 192.168.1.10:16666', true); return; }
  try {
    const r = await fetch('/api/remote', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({addr}),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.statusText);
    showMsg('发送端地址已设置: ' + addr + '（每秒同步 TX 统计）', false);
  } catch (e) { showMsg('设置发送端地址失败: ' + e.message, true); }
}

async function doStop() {
  try {
    const r = await fetch('/api/stop', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mode: currentMode}),
    });
    if (!r.ok) throw new Error(r.statusText);
    showMsg('已停止', false);
  } catch (e) { showMsg('停止失败: ' + e.message, true); }
}

// ---------- 状态 ----------

async function loadStatus() {
  try {
    const r = await fetch('/api/status?mode=' + currentMode);
    const st = await r.json();
    remoteControl = st.remote_control;
    const cur = st[currentMode] || {running: false, iface: '', log_file: ''};
    const badge = $('badge');
    if (cur.running) {
      badge.textContent = '运行中 ' + (cur.iface || '') + ' · ' + new Date(cur.started).toLocaleTimeString();
      badge.className = 'badge running';
      $('btnStart').disabled = true;
      $('btnStop').disabled = false;
      $('runHint').textContent = '';
      window._logFile = cur.log_file;
    } else {
      badge.textContent = '已停止';
      badge.className = 'badge stopped';
      $('btnStop').disabled = true;
      const others = [];
      if (st.send && st.send.running) others.push('发送端运行中');
      if (st.recv && st.recv.running) others.push('接收端运行中');
      if (st.bidir && st.bidir.running) others.push('双向运行中');
      $('runHint').textContent = (others.length ? '【' + others.join(' / ') + '】' : '') +
        (cur.log_file ? ' · 日志: ' + cur.log_file : '');
      updateStartButton();
    }
    $('btnApply').disabled = !remoteControl;
    $('iface').disabled = !remoteControl;
  } catch (e) { /* 服务未就绪 */ }
}

// ---------- 图表 ----------

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}

function drawChart(hist) {
  resize();
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const W = canvas.width / devicePixelRatio, H = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, W, H);
  // 聚合：10 × 100ms = 1s 一个点（包离散在 100ms 窗口有 ±1 包物理抖动，聚合后曲线平滑）
  const AGG = 10;
  const aggN = Math.floor(hist.t.length / AGG);
  if (aggN < 2) {
    ctx.fillStyle = "#666"; ctx.font = "13px sans-serif";
    ctx.fillText("暂无数据（开始测试后显示曲线）", W/2 - 110, H/2);
    return;
  }
  const t = new Array(aggN), txs = [], rxs = [];
  for (let f = 0; f < hist.tx.length; f++) { txs.push(new Array(aggN)); rxs.push(new Array(aggN)); }
  for (let i = 0; i < aggN; i++) {
    t[i] = hist.t[i * AGG + AGG - 1];
    for (let f = 0; f < hist.tx.length; f++) {
      let s1 = 0, s2 = 0;
      for (let j = 0; j < AGG; j++) { s1 += hist.tx[f][i*AGG+j]; s2 += hist.rx[f][i*AGG+j]; }
      txs[f][i] = s1 / AGG; rxs[f][i] = s2 / AGG;
    }
  }
  const n = Math.min(t.length, WINDOW);
  let max = 1;
  for (let f = 0; f < txs.length; f++) {
    for (let i = txs[f].length - n; i < txs[f].length; i++) {
      max = Math.max(max, txs[f][i], rxs[f][i]);
    }
  }
  ctx.strokeStyle = "#333"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = H - 20 - g / 4 * (H - 40);
    ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillStyle = "#888"; ctx.font = "11px sans-serif";
    ctx.fillText((max * g / 4 * 8 / 1e6).toFixed(2) + " Mbps", 2, y + 4);
  }
  const plot = (arr, color, dash) => {
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.setLineDash(dash);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const v = arr[i];
      const px = 40 + i / (n - 1) * (W - 40);
      const py = H - 20 - (v / max) * (H - 40);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  };
  for (let f = 0; f < txs.length; f++) {
    plot(txs[f].slice(-n), COLORS[f % 8], []);
    plot(rxs[f].slice(-n), COLORS[f % 8], [4, 3]);
  }
}

// ---------- 统计表格 ----------

function renderTable(flows, running, remote) {
  const tbody = $('statsBody');
  tbody.innerHTML = '';
  const fmt = v => v >= 1e9 ? (v/1e9).toFixed(2)+'G' : v >= 1e6 ? (v/1e6).toFixed(2)+'M'
             : v >= 1e3 ? (v/1e3).toFixed(2)+'K' : v;
  // 远端数据：只要有缓存就显示（发送端离线时保留最后拉到的累计值）
  const hasRemote = remote && remote.tx_packets && remote.tx_packets.length > 0;
  for (let i = 0; i < flows.length; i++) {
    const f = flows[i];
    // 停止后：丢包 = seq 空洞 + 尾部差（发送已发出、接收未确认），如实反映收发不一致；
    // 运行中保持 seq 口径（RX 天然滞后于 TX，属正常管道延迟）。
    let lost = f.lost;
    let lossRate = f.loss_rate;
    if (!running) {
      lost += Math.max(0, f.tx_packets - f.rx_packets - f.lost);
      lossRate = f.tx_packets > 0 ? lost / f.tx_packets : 0;
    }
    const tr = document.createElement('tr');
    if (lossRate > 0) tr.className = 'loss';
    // 接收端角色：TX 列显示远端发送端的速率（同步数据）；无远端时显示 -
    let txMbps, txPps, txPkts;
    if (currentMode === 'recv') {
      txMbps = hasRemote && remote.tx_bps[i] != null ? (remote.tx_bps[i]*8/1e6).toFixed(2) : '-';
      txPps = hasRemote && remote.tx_pps[i] != null ? remote.tx_pps[i].toFixed(0) : '-';
      txPkts = hasRemote ? fmt(remote.tx_packets[i]) : '-';
    } else {
      txMbps = (f.tx_bps*8/1e6).toFixed(2);
      txPps = f.tx_pps.toFixed(0);
      txPkts = fmt(f.tx_packets);
    }
    tr.innerHTML =
      `<td>${esc(f.name)}</td><td>${f.dscp}</td><td>${f.src_ip}:${f.src_port}->${f.dst_ip}:${f.dst_port}</td>` +
      `<td>${txMbps}</td><td>${txPps}</td>` +
      `<td class="sc-rx">${(f.rx_bps*8/1e6).toFixed(2)}</td><td class="sc-rx">${f.rx_pps.toFixed(0)}</td>` +
      `<td>${txPkts}</td><td class="sc-rxpk">${fmt(f.rx_packets)}</td>` +
      `<td class="sc-loss">${fmt(lost)}</td><td class="sc-loss">${(lossRate*100).toFixed(2)}%</td>`;
    tbody.appendChild(tr);
  }
  applyStatsColumnVisibility();
}

// ---------- 轮询 ----------

let lastStats = {flows: [], history: {t: [], tx: [], rx: []}};

// applyStatsColumnVisibility 按角色隐藏统计表无意义列：
// 单发（send）本端不接收 → 隐藏 RX Mbps/RX pps/RX包/丢失/丢包率。
// 单收（recv）/双向显示全部（recv 的 TX 列为远端同步）。
function applyStatsColumnVisibility() {
  const hideSend = currentMode === 'send';
  const sel = (cls, hide) => {
    document.querySelectorAll('#statsTable th.' + cls).forEach(el => el.style.display = hide ? 'none' : '');
    document.querySelectorAll('#statsTable td.' + cls).forEach(el => el.style.display = hide ? 'none' : '');
  };
  sel('sc-rx', hideSend);
  sel('sc-rxpk', hideSend);
  sel('sc-loss', hideSend);
  // colgroup 同步（统计表列索引：5=RX Mbps 6=RX pps 8=RX包 9=丢失 10=丢包率）
  [5, 6, 8, 9, 10].forEach(i => {
    if (statsResize.cols[i]) statsResize.cols[i].style.display = hideSend ? 'none' : '';
  });
}

// updateIfaceStat 显示接口级抓包统计（诊断"网卡有流量但 RX 为 0"）。
function updateIfaceStat(st, running) {
  const el = $('ifaceStat');
  if (currentMode === 'send' || !st) { el.style.display = 'none'; return; }
  el.style.display = '';
  const total = st.total_pkts, matched = st.matched_pkts, other = st.other_pkts;
  let tip = '接口流量: 总计 ' + fmt(total) + ' 包 | 匹配 ' + fmt(matched) + ' | 其他 ' + fmt(other);
  if (total > 0 && matched === 0) {
    tip += ' ← 流量与配置不匹配：请核对 5 元组（IP/端口）和 DSCP，或确认对端是 qostool 发送';
    el.style.color = '#ffb020';
  } else if (total === 0 && running) {
    tip += ' ← 接口上未抓到任何 IP 包：请确认监听接口正确';
    el.style.color = '#ffb020';
  } else {
    el.style.color = '#888';
  }
  el.textContent = tip;
}

// updateRemoteStatus 显示接收端与发送端的连接状态。
function updateRemoteStatus(remote) {
  const el = $('remoteStatus');
  if (currentMode !== 'recv') { el.style.display = 'none'; return; }
  el.style.display = '';
  if (!remote) {
    el.textContent = '未连接';
    el.style.color = '#888';
  } else if (remote.online) {
    el.textContent = '已连接 · 更新于 ' + new Date(remote.updated).toLocaleTimeString() + (remote.running ? ' · 发送端运行中' : ' · 发送端未运行');
    el.style.color = '#7dff7d';
  } else {
    el.textContent = '连接失败 · 发送端离线';
    el.style.color = '#ff5555';
  }
}

async function tick() {
  try {
    const r = await fetch('/api/stats?mode=' + currentMode);
    const d = await r.json();
    lastStats = d;
    document.getElementById('clock').textContent = new Date(d.now).toLocaleTimeString();
    drawChart(d.history);
    renderTable(d.flows, d.running, d.remote);
    updateRemoteStatus(d.remote);
    updateIfaceStat(d.iface_stat, d.running);
  } catch (e) { /* 服务未就绪 */ }
  setTimeout(tick, 500);
}

function showMsg(text, isErr) {
  const m = $('msg');
  m.textContent = text;
  m.className = isErr ? 'err' : 'ok';
  m.style.display = 'block';
}

// 可拖动列宽（配置表 9 列 / 统计表 11 列），宽度记忆在 localStorage
const cfgResize = initTableResize('cfgTable', 'qostool.cfgWidths', [90, 115, 62, 115, 62, 62, 82, 82, 72]);
const statsResize = initTableResize('statsTable', 'qostool.statsWidths', [105, 55, 195, 75, 68, 75, 68, 70, 70, 60, 72]);
// 速率列在 colgroup 中的索引（配置表第 7/8/9 列）
const RATE_COL_IDX = [6, 7, 8];

$('btnStart').onclick = doStart;
$('btnStop').onclick = doStop;
$('btnApply').onclick = applyConfig;
$('btnRefreshIface').onclick = () => loadInterfaces(false);
$('iface').onchange = () => { applyIface(); updateStartButton(); };
$('role').onchange = e => setRole(e.target.value);
$('btnRemote').onclick = setRemote;
refreshRoleUI();

// 图例（按实际配置的流名生成，最多 8）
function buildLegend(flows) {
  const legend = $('legend');
  legend.innerHTML = '';
  const note = document.createElement('span');
  note.innerHTML = 'TX 实线 / RX 虚线：';
  legend.appendChild(note);
  for (let i = 0; i < flows.length; i++) {
    const s = document.createElement('span');
    s.innerHTML = `<span class="sw" style="background:${COLORS[i % 8]}"></span>${esc(flows[i].name)}`;
    legend.appendChild(s);
  }
}

loadInterfaces(true);
loadConfig();
loadStatus();
setInterval(loadStatus, 1000);
tick();
</script>
