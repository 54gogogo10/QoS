# qostool 示例配置：8 条流覆盖常用 DSCP 优先级
# 收发两端使用同一份配置；接收端按 DSCP + 5 元组精确匹配
flows:
  - name: 语音-EF
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10000
    dst_port: 20000
    dscp: EF          # 46
    rate_mbps: 2
    payload_size: 160
  - name: 视频-AF41
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10001
    dst_port: 20001
    dscp: AF41        # 34
    rate_mbps: 8
    payload_size: 1200
  - name: 交互-AF31
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10002
    dst_port: 20002
    dscp: AF31        # 26
    rate_mbps: 4
    payload_size: 512
  - name: 批量-AF21
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10003
    dst_port: 20003
    dscp: AF21        # 18
    rate_mbps: 10
    payload_size: 1024
  - name: 信令-CS6
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10004
    dst_port: 20004
    dscp: CS6         # 48
    rate_mbps: 1
    payload_size: 200
  - name: 视频会议-CS5
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10005
    dst_port: 20005
    dscp: CS5         # 40
    rate_pps: 500
    payload_size: 300
  - name: 尽力而为-CS4
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10006
    dst_port: 20006
    dscp: CS4         # 32
    rate_mbps: 20
    payload_size: 1400
  - name: 背景-BE
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10007
    dst_port: 20007
    dscp: BE          # 0
    rate_mbps: 30
    rate_pps: 20000
    payload_size: 1400
