# qostool 示例配置：8 条流覆盖常用 DSCP 优先级
# 收发两端使用同一份配置；接收端按 DSCP + 5 元组精确匹配
flows:
  - name: 语音-EF
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10000
    dst_port: 20000
    dscp: EF          # 46
    rate_mbps: 2
    ip_len: 188
    # 阈值判定（v2.7.0，可选）：0/缺省=不判定；停止时写入 HTML 报告
    # max_loss_rate_pct: 0.5   # 丢包率阈值 %
    # max_avg_delay_ms: 50     # 平均时延阈值 ms
    # max_jitter_ms: 10        # 抖动阈值 ms
  - name: 视频-AF41
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10001
    dst_port: 20001
    dscp: AF41        # 34
    rate_mbps: 8
    ip_len: 1228
  - name: 交互-AF31
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10002
    dst_port: 20002
    dscp: AF31        # 26
    rate_mbps: 4
    ip_len: 540
  - name: 批量-AF21
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10003
    dst_port: 20003
    dscp: AF21        # 18
    rate_mbps: 10
    ip_len: 1052
  - name: 信令-CS6
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10004
    dst_port: 20004
    dscp: CS6         # 48
    rate_mbps: 1
    ip_len: 228
  - name: 视频会议-CS5
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10005
    dst_port: 20005
    dscp: CS5         # 40
    rate_pps: 500
    ip_len: 328
  - name: 尽力而为-CS4
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10006
    dst_port: 20006
    dscp: CS4         # 32
    rate_mbps: 20
    ip_len: 1428
  - name: 背景-BE
    protocol: udp
    src_ip: 192.168.1.10
    dst_ip: 192.168.1.20
    src_port: 10007
    dst_port: 20007
    dscp: BE          # 0
    rate_mbps: 30
    rate_pps: 20000
    ip_len: 1428
